# /** Chat practice AI · chat/chat-ai-practice
#  * 공통 values.yaml 다음에 이 파일 하나를 적용해 역할별 Deployment·Service를 구성한다.
#  */
configMap:
  data:
    DB_ECHO: 'false'
    GUARDRAIL_ENFORCE_PERCENT: '100'
    GUARDRAIL_MODE: shadow
    LLM_BASE_URL: https://openrouter.ai/api/v1
containerPort: 8000
# /** Runtime Secret
#  * 공유 Secret의 AI 속성과 모델 키를 chat-ai-practice-secret으로 매핑해 Pod envFrom에 주입한다.
#  */
externalSecret:
  data:
  - remoteRef:
      key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
      property: AI_DATABASE_URL
    secretKey: DATABASE_URL
  - remoteRef:
      key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
      property: AI_INTERNAL_API_KEY
    secretKey: INTERNAL_API_KEY
  - remoteRef:
      key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
      property: AI_LANGFUSE_PUBLIC_KEY
    secretKey: LANGFUSE_PUBLIC_KEY
  - remoteRef:
      key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
      property: AI_LANGFUSE_SECRET_KEY
    secretKey: LANGFUSE_SECRET_KEY
  - remoteRef:
      key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
      property: AI_LLM_API_KEY
    secretKey: LLM_API_KEY
  - remoteRef:
      key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
      property: AI_SENTRY_DSN
    secretKey: SENTRY_DSN
  - remoteRef:
      key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/ai/slm-api-key-8VzUsP
      property: vllm_api_key
    secretKey: SLM_API_KEY
image:
  digest: sha256:4aab3f57df914bcbb6e189879d2c7c3cdc191ddd6125771d96c666fc0b35dd74
  repository: 975779326240.dkr.ecr.ap-northeast-2.amazonaws.com/star23/ai
labels:
  component: ai-server
  framework: fastapi
  team: ai
nameOverride: chat-ai-practice
probes:
  liveness:
    initialDelaySeconds: 30
    path: "/health"
  readiness:
    path: "/health"
resources:
  limits:
    cpu: '1'
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi
# /** Internal AI service
#  * chat의 chat-ai-practice Service를 BE·WS가 호출하며 Ingress는 만들지 않는다.
#  */
service:
  port: 8000
serviceAccount:
  create: false
