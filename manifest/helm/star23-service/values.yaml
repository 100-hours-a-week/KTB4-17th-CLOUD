# star-EKS-v3의 현재 배포를 기준으로 한 기본값입니다 (2026-11-10).
# 역할마다 이미지·포트·설정이 다르므로 values/<릴리스>.yaml 하나를 함께 지정합니다.
# 예: helm template user-api ./manifest/helm/star23-service -n user \
#       -f ./manifest/helm/star23-service/values/user-api.yaml
nameOverride: ""
replicaCount: 1

# 기본값은 비활성화입니다. 앱별 values/<릴리스>.yaml에서 활성화합니다.
# 활성화하면 replicaCount 대신 HPA가 Deployment의 Pod 개수를 관리합니다.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # CPU limits가 아닌 requests 대비 평균 CPU 사용률입니다.
  targetCPUUtilizationPercentage: 70
  # 필요하면 scaleUp/scaleDown 정책을 앱별로 지정합니다.
  behavior: {}

image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

command: []
args: []

containerPort: 8080
service:
  enabled: true
  port: 8080

labels:
  component: api-server
  partOf: star23sharp
  team: user
  environment: prod
  framework: ""

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector:
  workload-class: general
tolerations: []
affinity: {}

configMap:
  enabled: true
  data: {}

env: []
envFrom: []
serviceAccountName: ""
serviceAccount:
  create: true

# Requires External Secrets Operator and Pod Identity on its controller ServiceAccount.
# Secrets Manager values are never stored in this chart.
externalSecret:
  enabled: true
  region: ap-northeast-2
  refreshInterval: 1h
  parameterStoreEnabled: false
  data: []

probes:
  readiness:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 10
  liveness:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 180

ingress:
  enabled: false
  host: v3.star23sharp.com
  path: /
  pathType: Prefix
  paths: []
  groupName: star23-v3
  groupOrder: 1
  listenPorts: '[{"HTTPS":443}]'
  certificateArn: ""
  healthcheckPath: /actuator/health
