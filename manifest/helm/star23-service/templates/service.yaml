{{/* Service
 * 이름·릴리스 라벨이 같은 Pod를 골라 http 컨테이너 포트로 요청을 전달한다.
 */}}
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "star23.name" . }}
  labels:
    {{- include "star23.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "star23.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
