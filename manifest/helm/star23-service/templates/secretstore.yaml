{{/* Secrets Manager SecretStore
 * ExternalSecret의 기본 조회처이며, 인증은 별도 설정된 ESO 컨트롤러의 Pod Identity를 사용한다.
 */}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "star23.name" . }}-aws-secretsmanager
  labels:
    {{- include "star23.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecret.region is required" .Values.externalSecret.region | quote }}
{{- end }}
