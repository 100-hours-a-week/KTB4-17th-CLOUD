{{/* ConfigMap
 * 일반 설정을 담아 Pod envFrom으로 전달하며, override가 없으면 데이터 해시가 롤아웃을 유도한다.
 */}}
{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "star23.name" . }}-config
  labels:
    {{- include "star23.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
