{{- if .Values.externalSecret.enabled }}
{{- $entries := required "externalSecret.data must contain at least one mapping" .Values.externalSecret.data }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "star23.name" . }}
  labels:
    {{- include "star23.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ required "externalSecret.refreshInterval is required" .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "star23.name" . }}-aws-secretsmanager
    kind: SecretStore
  target:
    name: {{ include "star23.name" . }}-secret
    creationPolicy: Owner
  data:
    # 어떤 값을 가져올지: values의 externalSecret.data에 정의한 항목을 조회합니다.
    # remoteRef.key는 AWS Secret 이름/ARN 또는 SSM 파라미터 경로입니다.
    # remoteRef.property는 Secret 내부 키, secretKey는 생성할 Kubernetes Secret의 키입니다.
    # store: ParameterStore인 항목은 SSM을 사용하고, 생략한 항목은 Secrets Manager를 사용합니다.
    {{- range $entry := $entries }}
    {{- $remote := required "externalSecret.data[].remoteRef is required" $entry.remoteRef }}
    - secretKey: {{ required "externalSecret.data[].secretKey is required" $entry.secretKey | quote }}
      remoteRef:
        key: {{ required (printf "externalSecret remote key is required for %s" $entry.secretKey) $remote.key | quote }}
        {{- with $remote.property }}
        property: {{ . | quote }}
        {{- end }}
      {{- if eq (default "" $entry.store) "ParameterStore" }}
      sourceRef:
        storeRef:
          name: {{ include "star23.name" $ }}-aws-parameterstore
          kind: SecretStore
      {{- else if $entry.store }}
      {{- fail (printf "unsupported externalSecret store %s" $entry.store) }}
      {{- end }}
    {{- end }}
{{- end }}
