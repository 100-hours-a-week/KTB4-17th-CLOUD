{{- if and .Values.externalSecret.enabled .Values.externalSecret.parameterStoreEnabled }}
# 어디에 접속할지: 지정한 리전의 AWS SSM Parameter Store를 연결합니다.
# Redis URL은 저장된 값이며, 조회할 파라미터 경로는 externalsecret.yaml에서 지정합니다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "star23.name" . }}-aws-parameterstore
  labels:
    {{- include "star23.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "externalSecret.region is required" .Values.externalSecret.region | quote }}
      # ESO controller uses its own EKS Pod Identity credentials. No auth stanza.
{{- end }}
