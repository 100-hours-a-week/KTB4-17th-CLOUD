# /** WebSocket secret example
#  * websocket.values.yaml과 역할 예제 뒤에 합치며, 기존 v2 RDS 자격증명과 앱 Secret을 공유한다.
#  */
externalSecret:
  enabled: true
  parameterStoreEnabled: true
  # /** ESO key mapping
  #  * ESO가 remoteRef 속성을 secretKey로 옮겨 역할별 Secret을 만들고, Pod는 envFrom으로 읽는다.
  #  */
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: JWT_SECRET
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: CLIENT_SECRET
    - secretKey: AI_PRACTICE_API_KEY
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        # BE와 AI가 같은 인증키 원본을 읽도록 맞춥니다.
        property: AI_INTERNAL_API_KEY
    - secretKey: AI_PRACTICE_CALLBACK_SECRET
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: AI_PRACTICE_CALLBACK_SECRET
    # /** Redis parameter mapping
    #  * ParameterStore용 SecretStore에서 WS 전용 SSM 경로를 읽으며, BE용 Redis 예제와 구분한다.
    #  */
    - secretKey: REDIS_URL
      store: ParameterStore
      remoteRef:
        key: /star23/prod/migration/kafka-redis/ws/REDIS_URL
    - secretKey: SPRING_DATA_REDIS_URL
      store: ParameterStore
      remoteRef:
        key: /star23/prod/migration/kafka-redis/ws/REDIS_URL
    - secretKey: PROFILE_CACHE_REDIS_URL
      store: ParameterStore
      remoteRef:
        key: /star23/prod/migration/kafka-redis/ws/REDIS_URL
