# Overlay after backend.values.yaml and the role values file.
# v3 intentionally reuses the existing v2 production RDS credential.
externalSecret:
  enabled: true
  parameterStoreEnabled: true
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: JWT_SECRET
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: CLIENT_SECRET
    - secretKey: AI_PRACTICE_API_KEY
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: AI_PRACTICE_API_KEY
    - secretKey: AI_PRACTICE_CALLBACK_SECRET
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:975779326240:secret:star23/prod/be-q1bpe9
        property: AI_PRACTICE_CALLBACK_SECRET
    - secretKey: REDIS_URL
      store: ParameterStore
      remoteRef:
        key: /star23/prod/migration/kafka-redis/be/REDIS_URL
    - secretKey: SPRING_DATA_REDIS_URL
      store: ParameterStore
      remoteRef:
        key: /star23/prod/migration/kafka-redis/be/REDIS_URL
    - secretKey: PROFILE_CACHE_REDIS_URL
      store: ParameterStore
      remoteRef:
        key: /star23/prod/migration/kafka-redis/be/REDIS_URL
