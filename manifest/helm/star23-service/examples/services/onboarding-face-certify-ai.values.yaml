# /** Onboarding Face Certify AI example
#  * ai.values.yaml 뒤에 적용하는 user/onboarding-face-certify-ai 역할 예제이며, secrets/ai.values.yaml을 마지막에 합친다.
#  */
nameOverride: onboarding-face-certify-ai
service:
  enabled: true
  port: 8000
ingress:
  enabled: false
nodeSelector:
  workload-class: cpu
resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "2"
    memory: 4Gi
