# /** Recommend API example
#  * backend.values.yaml 뒤에 적용하는 recommend/recommend-api 역할 예제이며, secrets/backend.values.yaml을 마지막에 합친다.
#  */
nameOverride: recommend-api
service:
  enabled: true
  port: 8080
ingress:
  enabled: true
  # /** Recommendation routes
  #  * Prefix는 하위 경로까지, Exact는 지정한 경로만 ALB에서 이 Service로 전달한다.
  #  */
  paths:
    - path: "/api/v1/likes"
      pathType: Prefix
    - path: "/api/v1/recommendation-batches"
      pathType: Prefix
    - path: "/api/v1/users/me/recommendation-passes"
      pathType: Prefix
    - path: "/api/v1/users/me/preferences"
      pathType: Prefix
    - path: "/api/v1/popular-profiles"
      pathType: Exact
