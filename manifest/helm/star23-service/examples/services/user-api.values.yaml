nameOverride: user-api
service:
  enabled: true
  port: 8080
ingress:
  enabled: true
  paths:
    - path: "/api/v1/notifications"
      pathType: Prefix
    - path: "/api/v1/users/me/blocks"
      pathType: Prefix
    - path: "/api/v1/users/me"
      pathType: Exact
    - path: "/api/v1/users/*/profile"
      pathType: ImplementationSpecific
    - path: "/api/v1/registration"
      pathType: Prefix
    - path: "/api/v1/files"
      pathType: Prefix
configMap:
  data:
    APP_NOTIFICATION_OUTBOX_WORKER_ENABLED: "true"
    APP_NOTIFICATION_DELIVERY_RESULT_TIMEOUT_MS: "15000"
    APP_NOTIFICATION_OUTBOX_WORKER_FIXED_DELAY_MS: "1000"
    APP_NOTIFICATION_OUTBOX_WORKER_MAX_REQUESTS_PER_RUN: "100"
    APP_NOTIFICATION_OUTBOX_WORKER_SHUTDOWN_WAIT_SECONDS: "20"
    APP_NOTIFICATION_DELIVERY_ENABLED: "true"
    APP_NOTIFICATION_DELIVERY_GROUP_ID_PREFIX: "v3-notification-sse-v1"
    NOTIFICATION_DELIVERY_TOPIC: "prod-notification-delivery-v1"
