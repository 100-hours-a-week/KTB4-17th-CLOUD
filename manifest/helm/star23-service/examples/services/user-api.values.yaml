# /** User API example
#  * backend.values.yaml 뒤에 적용하는 user/user-api 역할 예제이며, secrets/backend.values.yaml을 마지막에 합친다.
#  */
nameOverride: user-api
service:
  enabled: true
  port: 8080
ingress:
  enabled: true
  paths:
    - path: "/api/v1/notifications"
      pathType: Prefix
    - path: "/api/v1/users/me/blocks"
      pathType: Prefix
    - path: "/api/v1/users/me"
      pathType: Exact
    - path: "/api/v1/users/*/profile"
      pathType: ImplementationSpecific
    - path: "/api/v1/registration"
      pathType: Prefix
    - path: "/api/v1/files"
      pathType: Prefix
# /** Notification delivery
#  * 알림 생성·outbox relay는 끄고, v3 전용 그룹 접두사로 기존 delivery 토픽의 전달 consumer만 켠다.
#  */
configMap:
  data:
    APP_NOTIFICATION_CREATION_ENABLED: "false"
    APP_NOTIFICATION_OUTBOX_RELAY_ENABLED: "false"
    APP_NOTIFICATION_DELIVERY_ENABLED: "true"
    APP_NOTIFICATION_DELIVERY_GROUP_ID_PREFIX: "v3-notification-sse-v1"
    NOTIFICATION_DELIVERY_TOPIC: "prod-notification-delivery-v1"
