# /** Onboarding Persona AI example
#  * ai.values.yaml 뒤에 적용하는 user/onboarding-persona-ai 역할 예제이며, secrets/ai.values.yaml을 마지막에 합친다.
#  */
nameOverride: onboarding-persona-ai
# /** Persona service
#  * onboarding-api의 AI_PERSONA_BASE_URL·AI_KAKAO_BASE_URL이 함께 가리키는 내부 HTTP Service다.
#  */
service:
  enabled: true
  port: 8000
ingress:
  enabled: false
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
