# /** Auth API example
#  * backend.values.yaml 뒤에 적용하는 auth/auth-api 역할 예제이며, secrets/backend.values.yaml을 마지막에 합친다.
#  */
nameOverride: auth-api
service:
  enabled: true
  port: 8080
ingress:
  enabled: true
  paths:
    - path: "/api/v1/auth"
      pathType: Prefix
# /** Login redirects
#  * Kakao 로그인 콜백과 로그인 후 브라우저 이동 주소를 v3 호스트에 맞춘다.
#  */
configMap:
  data:
    REDIRECT_URI: "https://v3.star23sharp.com/api/v1/auth/kakao/callback"
    AUTH_SERVICE_REDIRECT_URI: "https://v3.star23sharp.com/home"
    AUTH_REGISTRATION_REDIRECT_URI: "https://v3.star23sharp.com/registration"
    AUTH_ONBOARDING_REDIRECT_URI: "https://v3.star23sharp.com/onboarding"
