# Layer on examples/websocket.values.yaml; this names the role-specific ClusterIP Service.
nameOverride: chat-socket
service:
  enabled: true
  port: 8080
ingress:
  enabled: true
  # Chat REST endpoints and WebSocket share the chat-socket runtime.
  paths:
    - path: "/api/v1/chat-rooms"
      pathType: Prefix
    - path: "/ws/chat"
      pathType: Exact
configMap:
  data:
    APP_CHAT_RUNTIME_ENABLED: "true"
    AI_PRACTICE_BASE_URL: http://chat-ai-practice.chat.svc.cluster.local:8000
    AI_CHAT_DELEGATION_BASE_URL: http://chat-ai-cleanup.chat.svc.cluster.local:8000
