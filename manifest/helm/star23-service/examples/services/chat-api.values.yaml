# Layer on examples/backend.values.yaml; this names the role-specific ClusterIP Service.
nameOverride: chat-api
service:
  enabled: true
  port: 8080
ingress:
  enabled: true
  paths:
    - path: "/api/v1/ai-practice"
      pathType: Prefix
    - path: "/api/v1/ai-simulations"
      pathType: Prefix
configMap:
  data:
    # Enabling runtime also starts the current image's Kafka relay with the v2 consumer group.
    # Keep false until that group is isolated and the chat API rollout is validated.
    APP_CHAT_RUNTIME_ENABLED: "false"
