# /** Chat AI Simulation example
#  * ai.values.yaml 뒤에 적용하는 chat/chat-ai-simulation 역할 예제이며, secrets/ai.values.yaml을 마지막에 합친다.
#  */
nameOverride: chat-ai-simulation
service:
  enabled: true
  port: 8000
ingress:
  enabled: false
nodeSelector:
  workload-class: general
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
