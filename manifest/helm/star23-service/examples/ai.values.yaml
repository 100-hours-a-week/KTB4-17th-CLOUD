# /** AI example
#  * 전체 FastAPI 이미지를 쓰는 공통 참고값이며 역할→Secret 예제를 뒤에 합친다. 현재 배포는 values/를 사용한다.
#  */
nameOverride: ai
image:
  repository: 975779326240.dkr.ecr.ap-northeast-2.amazonaws.com/star23/ai
  digest: sha256:4aab3f57df914bcbb6e189879d2c7c3cdc191ddd6125771d96c666fc0b35dd74
replicaCount: 1
containerPort: 8000
service:
  port: 8000
labels:
  component: ai-server
  partOf: star23sharp
  team: ai
  environment: prod
  framework: fastapi
nodeSelector:
  workload-class: general
probes:
  readiness:
    enabled: true
    path: /health
  liveness:
    enabled: true
    path: /health
ingress:
  enabled: false

# /** AI runtime configuration
#  * LLM_BASE_URL은 외부 추론 API 주소이며, 인증 키·DB URL은 secrets/ai.values.yaml에서 연결한다.
#  */
configMap:
  enabled: true
  data:
    DB_ECHO: "false"
    LLM_BASE_URL: https://openrouter.ai/api/v1
    GUARDRAIL_MODE: shadow
    GUARDRAIL_ENFORCE_PERCENT: "100"
