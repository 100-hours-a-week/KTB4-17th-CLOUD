# Existing FastAPI code and image; all current AI routes remain in one process.
nameOverride: ai
image:
  repository: 975779326240.dkr.ecr.ap-northeast-2.amazonaws.com/star23/ai
  digest: sha256:4aab3f57df914bcbb6e189879d2c7c3cdc191ddd6125771d96c666fc0b35dd74
replicaCount: 1
containerPort: 8000
service:
  port: 8000
labels:
  component: ai-server
  partOf: star23sharp
  team: ai
  environment: prod
  framework: fastapi
nodeSelector:
  workload-class: general
probes:
  readiness:
    enabled: true
    path: /health
  liveness:
    enabled: true
    path: /health
ingress:
  enabled: false

configMap:
  enabled: true
  data:
    DB_ECHO: "false"
    LLM_BASE_URL: https://openrouter.ai/api/v1
    GUARDRAIL_MODE: shadow
    GUARDRAIL_ENFORCE_PERCENT: "100"
