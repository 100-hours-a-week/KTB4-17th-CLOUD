apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onboarding-persona-ai
  namespace: argocd
spec:
  project: star23-apps
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-17th-CLOUD.git
    # 현재 연결 브랜치입니다. 배포 브랜치로 통합하면 모든 Application의 값을 함께 변경합니다.
    targetRevision: feat/kube
    path: manifest/helm/star23-service
    helm:
      releaseName: onboarding-persona-ai
      valueFiles:
        - values/onboarding-persona-ai.yaml
  destination:
    # Argo CD도 star-EKS-v3에 설치하는 구성입니다.
    server: https://kubernetes.default.svc
    namespace: user
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
