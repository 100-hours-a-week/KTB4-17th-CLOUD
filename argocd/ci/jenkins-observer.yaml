# Apply separately to prod and staging. Jenkins can GET only these Applications.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployment-observer
  namespace: argocd
rules:
- apiGroups: [argoproj.io]
  resources: [applications]
  verbs: [get]
  resourceNames:
  - auth-api
  - user-api
  - onboarding-api
  - chat-api
  - chat-socket
  - recommend-api
  - onboarding-persona-ai
  - onboarding-face-certify-ai
  - chat-ai-practice
  - chat-ai-simulation
  - chat-ai-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployment-observer
  namespace: argocd
subjects:
- kind: Group
  name: star23-jenkins-observers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: jenkins-deployment-observer
  apiGroup: rbac.authorization.k8s.io
