apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-api
  namespace: argocd
spec:
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: star23-apps
  source:
    helm:
      releaseName: auth-api
      valueFiles:
      - values/staging/auth-api.yaml
    path: manifest/helm/star23-service
    repoURL: https://github.com/100-hours-a-week/KTB4-17th-CLOUD.git
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: false
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
    - FailOnSharedResource=true
