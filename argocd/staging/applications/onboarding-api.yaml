apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onboarding-api
  namespace: argocd
spec:
  destination:
    namespace: user
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: apps
    jsonPointers:
    - /spec/replicas
    kind: Deployment
    name: onboarding-api
    namespace: user
  project: star23-apps
  source:
    helm:
      releaseName: onboarding-api
      valueFiles:
      - values/staging/onboarding-api.yaml
    path: manifest/helm/star23-service
    repoURL: https://github.com/100-hours-a-week/KTB4-17th-CLOUD.git
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: false
      enabled: true
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
    - FailOnSharedResource=true
    - RespectIgnoreDifferences=true
